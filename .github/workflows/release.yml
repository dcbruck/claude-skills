name: release
# Push a tag like v1.1.0 and this builds one upload-ready zip per skill
# (for the Claude app and claude.ai) plus an all-skills zip, then publishes a release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py "$GITHUB_REF_NAME"
      - name: Build zips
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            n="${d%/}"
            zip -qr "../dist/${n}.zip" "$n"
          done
          cd ..
          zip -qr dist/all-skills.zip skills templates README.md INSTALL.md LICENSE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME}/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
